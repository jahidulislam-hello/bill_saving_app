name: vyzi
description: "VYZI"

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.9.0


dependencies:
  flutter:
    sdk: flutter

  get:
  dio:
  cached_network_image:
  shimmer:
  flutter_screenutil:
  hive:
  hive_flutter:
  connectivity_plus:
  path_provider:
  google_fonts:
  shared_preferences:
  flutter_secure_storage:
  flutter_svg:
  flutter_spinkit:
  pin_code_fields:
  image_picker:
  internet_connection_checker:
  fluttertoast:
  flutter_html:
  mime_type:
  intl:
  timeago:
  provider:
  photo_view:
  grouped_list:
  webview_flutter:
  dotted_border:
  google_maps_flutter:
  geolocator:
  geocoding:
  table_calendar:
  country_code_picker:
  easy_stepper:
  syncfusion_flutter_calendar:
  flutter_launcher_icons:
  flutter_keyboard_visibility:
  flutter_typeahead:
  http:
  mobile_scanner:

  # Firebase
  firebase_core:
  firebase_auth:

  # Social sign-in providers
  google_sign_in:
  sign_in_with_apple:
  flutter_facebook_auth:
  crypto:
  pretty_dio_logger: ^1.4.0



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints:
  flutter_launcher_icons:

flutter_launcher_icons:
    android: true
    ios: true
    remove_alpha_ios: true
    image_path: "assets/images/VYZI.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/images/home_new.png
